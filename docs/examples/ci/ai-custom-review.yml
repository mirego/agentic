# Example consumer workflow — custom prompt on top of the generic review engine.
# Copy into your repository as .github/workflows/ai-custom-review.yml
name: AI custom review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-custom-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    uses: mirego/agentic/.github/workflows/pi-pr-review.yml@v1.0.0
    with:
      profile-name: api-compat
      model: forra/gpt-5.6-terra
      thinking-level: high
      severity-threshold: medium
      # Use a prompt file from this repository:
      # prompt-file: caller:.github/ai/api-compat-review.md
      prompt: |
        Review this pull request for breaking API changes, missing input
        validation, and backwards-compatibility risks.

        Focus on public interfaces, request/response contracts, and migration
        hazards. Ignore pure style nits.
    secrets:
      FORRA_API_KEY: ${{ secrets.FORRA_API_KEY }}
